<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="Type a task" aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
    <p id="task-count">0 tasks left</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
